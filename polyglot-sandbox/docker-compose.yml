version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: polyglot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  redis:
    image: redis:alpine
    container_name: polyglot-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./backend
    container_name: polyglot-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/polyglot
      - JWT_SECRET=polyglot_sandbox_secret_998811
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HOST_PROJECT_PATH=/e/Downloads/polyglot-sandbox/polyglot-sandbox/backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongo
      - redis
    restart: always

  frontend:
    build: ./frontend
    container_name: polyglot-frontend
    ports:
      - "8081:8081"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend
    restart: always

volumes:
  mongo-data:
